# Tashqi reverse-proxy: HTTPS tugatish, statik frontend va /api -> backend.
# ${DOMAIN} qiymati docker-compose'da envsubst orqali almashtiriladi.

upstream luqma_api {
    server backend:8000;
}

upstream luqma_web {
    server frontend:80;
}

# --- HTTP: ACME tekshiruvi + HTTPS ga yo'naltirish ---
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt sertifikatni yangilash uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Telegram Mini App iframe ichida ochiladi — X-Frame-Options QO'YILMAYDI.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rasm yuklash uchun (8MB limit backend bilan mos)
    client_max_body_size 10M;

    # --- REST API ---
    location /api/ {
        proxy_pass http://luqma_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI tahlili uzoqroq davom etishi mumkin
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Yuklangan ovqat rasmlari ---
    location /media/ {
        proxy_pass http://luqma_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- Mini App (statik) ---
    location / {
        proxy_pass http://luqma_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
