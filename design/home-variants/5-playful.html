<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 — O'yin</title>
<link rel="stylesheet" href="./node_modules/@fontsource-variable/fredoka/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource-variable/nunito/index.css">
<style>
/* ============================================================
   5 — O'YIN (gamified)
   Yorqin gradient, qalin dumaloq shakllar, "3D" bosiladigan
   tugmalar (pastida qattiq soya bor — bosilganda cho'kadi).
   Halqa YO'Q: kaloriya to'lib boruvchi shisha bilan ko'rsatiladi.
   Streak, daraja, XP — o'yin mexanikasi ko'rinadi.
   Shrift: Fredoka (dumaloq).
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --v1:#7b2ff7; --v2:#f107a3; --lime:#c6f432; --sky:#38d9f9;
  --ink:#241340; --ink2:#6b5b8a; --card:#fff;
  --sh:0 6px 0 rgba(36,19,64,.16);
}
body{width:420px;min-height:900px;color:var(--ink);
  font-family:'Fredoka Variable',sans-serif;font-weight:500;
  background:linear-gradient(170deg,#7b2ff7 0%,#c936c0 42%,#ff7a59 100%);
  padding-bottom:0}

/* --- Tepa: avatar, daraja, streak --- */
.top{display:flex;align-items:center;gap:12px;padding:20px 20px 6px;color:#fff}
.ava{width:46px;height:46px;border-radius:18px;background:var(--lime);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--ink);
  box-shadow:0 5px 0 rgba(0,0,0,.18)}
.top .who{flex:1}
.top .who b{display:block;font-size:17px;font-weight:600}
.top .who span{font-size:12px;opacity:.85}
.streak{background:rgba(255,255,255,.2);border-radius:99px;padding:7px 13px;
  font-size:14px;font-weight:600;backdrop-filter:blur(6px)}

/* --- XP chizig'i --- */
.xp{margin:12px 20px 0;height:12px;border-radius:99px;background:rgba(0,0,0,.22)}
.xp i{display:block;height:100%;border-radius:99px;background:var(--lime);
  box-shadow:0 0 14px rgba(198,244,50,.8)}
.xplab{display:flex;justify-content:space-between;margin:6px 20px 0;color:#fff;font-size:11px;opacity:.9}

/* --- Asosiy: shisha to'ldirgich --- */
.hero{margin:18px 20px 0;background:var(--card);border-radius:34px;padding:22px;
  display:flex;align-items:center;gap:20px;box-shadow:0 10px 0 rgba(36,19,64,.18)}
.bottle{width:78px;height:150px;border-radius:38px 38px 26px 26px;background:#f0ecf8;
  position:relative;overflow:hidden;flex:none;border:4px solid var(--ink)}
.bottle .fill{position:absolute;left:0;right:0;bottom:0;height:18%;
  background:linear-gradient(180deg,var(--sky),#2bb8d4)}
.bottle .fill::before{content:'';position:absolute;left:0;right:0;top:-7px;height:14px;
  background:var(--sky);border-radius:50%}
.bottle .cap{position:absolute;left:50%;transform:translateX(-50%);top:8px;
  width:34px;height:6px;border-radius:99px;background:rgba(36,19,64,.15)}
.hero .info b{display:block;font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero .info span{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.hero .info .pill{display:inline-block;margin-top:12px;background:var(--lime);
  border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}

/* --- Makro: uch dumaloq "medal" --- */
.medals{display:flex;gap:12px;margin:16px 20px 0}
.medal{flex:1;background:var(--card);border-radius:26px;padding:14px 8px;text-align:center;
  box-shadow:0 6px 0 rgba(36,19,64,.18)}
.medal .c{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#fff}
.medal.p .c{background:linear-gradient(140deg,#7b2ff7,#b06bff)}
.medal.y .c{background:linear-gradient(140deg,#ff7a59,#ffb347)}
.medal.u .c{background:linear-gradient(140deg,#38d9f9,#4dd0a6)}
.medal u{display:block;font-size:12px;text-decoration:none;color:var(--ink2)}
.medal s{display:block;font-size:11px;text-decoration:none;color:var(--ink2);opacity:.7}

/* --- Vazifa kartochkasi --- */
.quest{margin:16px 20px 0;background:var(--ink);color:#fff;border-radius:28px;padding:18px 20px;
  display:flex;gap:14px;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.quest .badge{width:44px;height:44px;border-radius:16px;background:var(--lime);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);font-weight:600}
.quest b{display:block;font-size:15px;font-weight:600}
.quest span{font-size:12.5px;opacity:.8;line-height:1.4}

/* --- Ovqatlar: qiya kartochkalar --- */
.h2{margin:22px 20px 10px;color:#fff;font-size:17px;font-weight:600}
.meals{margin:0 20px;display:flex;flex-direction:column;gap:12px}
.meal{background:var(--card);border-radius:24px;padding:14px 16px;display:flex;
  align-items:center;gap:13px;box-shadow:0 6px 0 rgba(36,19,64,.18)}
.meal .ic{width:44px;height:44px;border-radius:16px;background:#f0ecf8;flex:none}
.meal .n{flex:1}
.meal .n b{display:block;font-size:15px;font-weight:600}
.meal .n s{text-decoration:none;font-size:12px;color:var(--ink2)}
.meal .k{font-size:19px;font-weight:600}

/* --- Pastki panel: katta pufakchali --- */
.nav{width:420px;margin:26px auto 0;
  background:var(--card);border-radius:32px 32px 0 0;padding:12px 16px 18px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 -6px 24px rgba(36,19,64,.2)}
.nav a{width:56px;height:52px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink2);text-decoration:none}
.nav a.on{background:var(--lime);color:var(--ink);font-weight:600}
.nav .fab{width:66px;height:66px;border-radius:50%;background:linear-gradient(150deg,#7b2ff7,#f107a3);
  color:#fff;font-size:30px;font-weight:500;margin-top:-26px;box-shadow:0 7px 0 rgba(36,19,64,.28)}
.sh{width:14px;height:14px;border-radius:5px;background:currentColor;opacity:.65}
</style></head>
<body>

<div class="top">
  <div class="ava">S</div>
  <div class="who"><b>Samandar</b><span>7-daraja · Sog'lom odat</span></div>
  <div class="streak">🔥 9</div>
</div>

<div class="xp"><i style="width:64%"></i></div>
<div class="xplab"><span>640 / 1000 XP</span><span>8-darajagacha</span></div>

<div class="hero">
  <div class="bottle"><div class="cap"></div><div class="fill"></div></div>
  <div class="info">
    <b>1723</b>
    <span>kaloriya qoldi</span>
    <div class="pill">377 / 2100 yeyildi</div>
  </div>
</div>

<div class="medals">
  <div class="medal p"><div class="c">11</div><u>Oqsil</u><s>150 g</s></div>
  <div class="medal y"><div class="c">12</div><u>Yog'</u><s>67 g</s></div>
  <div class="medal u"><div class="c">58</div><u>Uglevod</u><s>200 g</s></div>
</div>

<div class="quest">
  <div class="badge">!</div>
  <div><b>Bugungi vazifa</b><span>Yana 139 g oqsil yeng — +50 XP olasiz</span></div>
</div>

<div class="h2">Bugungi ovqatlar</div>
<div class="meals">
  <div class="meal"><div class="ic"></div><div class="n"><b>Sabzavotli salat</b><s>13:40</s></div><div class="k">145</div></div>
  <div class="meal"><div class="ic"></div><div class="n"><b>Non va choy</b><s>08:20</s></div><div class="k">232</div></div>
</div>

<div class="nav">
  <a class="on"><span class="sh"></span>Uy</a>
  <a><span class="sh"></span>AI</a>
  <a class="fab">+</a>
  <a><span class="sh"></span>Mashq</a>
  <a><span class="sh"></span>Profil</a>
</div>
</body></html>
