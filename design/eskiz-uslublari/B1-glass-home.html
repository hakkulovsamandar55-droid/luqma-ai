<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Glassmorphism — bosh sahifa</title>
<link rel="stylesheet" href="./node_modules/@fontsource-variable/inter/index.css">
<style>
/* ============================================================
   B — GLASSMORPHISM
   Rangli fon ustida muzlatilgan shisha qatlamlari. Har sirt
   yarim shaffof: orqadagi rang undan sizib turadi (backdrop
   blur). Chegara — bitta ingichka yorug' chiziq, soya deyarli
   yo'q. Chuqurlik soya bilan emas, QATLAM bilan beriladi.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
/* ::before fonni chetga chiqaradi — hujjat kengaymasligi uchun */
html{width:420px;overflow:hidden}
:root{
  --g-bg:rgba(255,255,255,.10);
  --g-bg2:rgba(255,255,255,.16);
  --g-br:rgba(255,255,255,.28);
  --ink:#fff; --ink2:rgba(255,255,255,.68); --ink3:rgba(255,255,255,.45);
  --hi:#8affd9;
}
body{width:420px;min-height:900px;color:var(--ink);
  font-family:'Inter Variable',sans-serif;position:relative;overflow:hidden;
  background:#2b1a4d}
/* Rangli "mesh" fon — shisha shu ranglarni ushlaydi */
body::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 18% 12%, #7b5cff 0%, transparent 62%),
    radial-gradient(42% 32% at 88% 22%, #ff4fa3 0%, transparent 62%),
    radial-gradient(46% 34% at 76% 74%, #22d3ee 0%, transparent 62%),
    radial-gradient(40% 30% at 12% 82%, #37f6a4 0%, transparent 62%),
    linear-gradient(160deg,#3b1d6e,#160c2b)}

.wrap{position:relative;padding:22px 18px 0}

/* --- Sarlavha: shisha lavha --- */
.head{border-radius:22px;padding:16px 20px;text-align:center;
  background:var(--g-bg);border:1px solid var(--g-br);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.head span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.head b{display:block;font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:4px;
  font-variant-numeric:tabular-nums}
.head b s{text-decoration:none;font-size:22px;font-weight:500;color:var(--ink3)}

/* --- Tana maydoni --- */
.stage{position:relative;margin-top:18px;height:372px;border-radius:28px;
  background:var(--g-bg);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.fig{position:absolute;left:50%;top:22px;transform:translateX(-50%)}

/* --- Halqa: shaffof shisha disk --- */
.dial{position:absolute;width:78px;text-align:center}
.dial .face{position:relative;width:70px;height:70px;margin:0 auto;border-radius:50%;
  background:var(--g-bg2);border:1px solid var(--g-br);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px rgba(0,0,0,.18)}
.dial svg{position:absolute;inset:0}
.dial .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 6px rgba(0,0,0,.35)}
.dial u{display:block;margin-top:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;color:var(--ink2)}

/* --- Qatorlar: shisha lentalar --- */
.rows{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:20px;
  background:var(--g-bg);border:1px solid var(--g-br);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.row.pri{background:var(--g-bg2);border-color:rgba(138,255,217,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 24px rgba(138,255,217,.18)}
.row .cap{width:40px;height:40px;border-radius:13px;flex:none;display:flex;
  align-items:center;justify-content:center;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.row p{flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em}
.row .go{color:var(--ink3);font-size:18px}

/* --- Pastki panel: suzuvchi shisha --- */
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;
  display:flex;gap:10px;padding:9px;border-radius:99px;
  background:var(--g-bg2);border:1px solid var(--g-br);
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 34px rgba(0,0,0,.3)}
.nav button{width:64px;height:52px;border:none;border-radius:99px;background:transparent;
  color:var(--ink2);display:flex;align-items:center;justify-content:center}
.nav button.on{background:rgba(255,255,255,.26);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
</style></head>

        <circle cx="35" cy="35" r="28" fill="none" stroke="#ff9ecb" stroke-width="5"

      </svg>
      <div class="v">15/15</div>
    </div>
    <u>Uglevod</u>
  </div>
</div>

<div class="rows">
