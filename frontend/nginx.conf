# Frontend konteyneri ichidagi nginx — faqat statik fayllarni beradi.
# Tashqi HTTPS/reverse-proxy vazifasini `nginx/nginx.conf` dagi proxy bajaradi.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hash'li asset'lar — uzoq muddatli kesh.
    # `expires` ishlatilmaydi: u ham Cache-Control yozadi va sarlavha ikkilanadi.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: barcha yo'llar index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Proxy orqali kelgan so'rovlar ham siqilsin (reverse-proxy HTTP/1.1 yuboradi)
    gzip_proxied any;
}
